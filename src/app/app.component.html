<div>
  <nav class="navbar navbar-expand-lg" style="background-color: lightgreen; color: navy">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/"> Organization Task Management</a>
      <button class="navbar-toggler" type="button" (click)="isCollapsed = !isCollapsed"
              aria-controls="navbarSupportedContent" [attr.aria-expanded]="!isCollapsed" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent" [ngbCollapse]="isCollapsed">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <strong><a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></strong>
          </li>
          <ng-container *ngIf="!authService.isLoggedIn">
            <li class="nav-item">
              <strong><a class="nav-link" routerLink="/signIn" routerLinkActive="active">Sign In</a></strong>
            </li>
            <li class="nav-item">
              <strong><a class="nav-link" routerLink="/signUp" routerLinkActive="active">Register</a></strong>
            </li>
          </ng-container>
          <li class="nav-item" *ngIf="authService.isLoggedIn">
            <strong><a class="nav-link" [routerLink]="authService.homeUrl()" routerLinkActive="active">My Portal</a></strong>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-3" *ngIf="authService.isLoggedIn">
          <span>
            {{ authService.user?.fullName }}
            <span class="badge text-bg-dark ms-1">{{ authService.role }}</span>
          </span>
          <button class="btn btn-outline-dark btn-sm" type="button" (click)="logout()">Logout</button>
        </div>
      </div>
    </div>
  </nav>
</div>
<!-- Page Content  -->
<router-outlet></router-outlet>
<app-toast-container></app-toast-container>
