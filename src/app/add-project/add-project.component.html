<h4 class="mb-3">Projects</h4>

<div class="card mb-4">
  <div class="card-header">Add Project</div>
  <div class="card-body">
    <form [formGroup]="addForm" (ngSubmit)="addProject()">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="organizationName" class="form-label">Organization</label>
          <select class="form-select" id="organizationName" formControlName="organizationName" [class.is-invalid]="invalid('organizationName')">
            <option [ngValue]="null" disabled>Select an organization</option>
            <option *ngFor="let org of organizationData" [ngValue]="org">{{ org.organizationName }}</option>
          </select>
          <div class="invalid-feedback">Organization is required.</div>
        </div>
        <div class="col-md-6">
          <label for="projectName" class="form-label">Project Name</label>
          <input type="text" class="form-control" id="projectName" formControlName="projectName" [class.is-invalid]="invalid('projectName')">
          <div class="invalid-feedback">Project Name is required.</div>
        </div>
      </div>
      <div class="d-flex justify-content-end mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="saving">{{ saving ? 'Adding...' : 'Add Project' }}</button>
      </div>
    </form>
  </div>
</div>

<div class="table-responsive bg-white border rounded">
  <table class="table table-striped mb-0">
    <thead>
    <tr>
      <th>#</th>
      <th>Project</th>
      <th>Organization</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let project of projects; let i = index">
      <td>{{ i + 1 }}</td>
      <td>{{ project.projectName }}</td>
      <td>{{ project.organizationName?.organizationName }}</td>
    </tr>
    <tr *ngIf="projects.length === 0">
      <td colspan="3" class="text-muted text-center">No projects yet.</td>
    </tr>
    </tbody>
  </table>
</div>
