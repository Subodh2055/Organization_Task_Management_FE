<h4 class="mb-1">Welcome, {{ auth.user()?.fullName }}</h4>
<p class="text-muted mb-4">{{ intro() }}</p>

@if (counts(); as counts) {
  <div class="row g-3">
    @for (card of cards(); track card.key) {
      <div class="col-sm-6 col-xl-4">
        <a class="card h-100 text-decoration-none border-{{ card.tone }}" [routerLink]="card.link" [queryParams]="card.query">
          <div class="card-body">
            <div class="display-6 fw-semibold text-{{ card.tone }}">{{ counts[card.key] ?? 0 }}</div>
            <div class="text-body">{{ card.label }}</div>
          </div>
        </a>
      </div>
    }
  </div>
  @if (auth.role() !== 'ADMIN') {
    <a class="btn btn-primary mt-4" [routerLink]="auth.homeUrl() + '/new-request'">New clarification request</a>
  }
} @else {
  <div class="text-muted">Loading...</div>
}
