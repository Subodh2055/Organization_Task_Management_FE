<div class="d-flex align-items-center justify-content-between mb-3">
  <h4 class="mb-0">Notifications</h4>
  @if (notificationService.unreadCount() > 0) {
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="markAllRead()">Mark all as read</button>
  }
</div>

<div class="list-group">
  @for (item of items(); track item.id) {
    <button type="button" class="list-group-item list-group-item-action d-flex gap-3 align-items-start"
            [class.list-group-item-primary]="!item.read" (click)="open(item)">
      <span class="badge mt-1" [class]="'badge mt-1 ' + badgeClass(item.type)">{{ labels[item.type] }}</span>
      <span class="flex-grow-1 text-start" [class.fw-semibold]="!item.read">{{ item.message }}</span>
      <span class="small text-muted text-nowrap">{{ item.createdAt | date: 'medium' }}</span>
    </button>
  } @empty {
    <div class="list-group-item text-muted">{{ loading() ? 'Loading...' : 'No notifications yet.' }}</div>
  }
</div>

@if (total() > pageSize) {
  <ngb-pagination class="d-flex justify-content-center mt-3" [collectionSize]="total()" [pageSize]="pageSize"
                  [page]="page()" (pageChange)="onPage($event)" [maxSize]="5" [boundaryLinks]="true" />
}
