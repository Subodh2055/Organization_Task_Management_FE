<div class="auth-page">
  <div class="auth-card">
    <h1>Sign In</h1>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" class="form-control" formControlName="username" autocomplete="username"
               [class.is-invalid]="invalid('username')">
        <div class="invalid-feedback">Username is required.</div>
      </div>
      <div class="mb-2">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" class="form-control" formControlName="password" autocomplete="current-password"
               [class.is-invalid]="invalid('password')">
        <div class="invalid-feedback">Password is required.</div>
      </div>
      <div class="text-end mb-4">
        <a routerLink="/forgot-password" class="small">Forgot your password?</a>
      </div>
      <button type="submit" class="btn btn-warning w-100" [disabled]="loading()">
        {{ loading() ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
    <p class="mt-3 mb-0">New customer? <a routerLink="/register">Create an account</a></p>
  </div>
</div>
