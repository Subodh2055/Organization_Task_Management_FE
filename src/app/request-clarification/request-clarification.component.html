<h4 class="mb-3">New Clarification Request</h4>

<div class="card">
  <div class="card-body">
    <div *ngIf="userData.length === 0" class="alert alert-warning">
      There is no {{ counterpartLabel }} to ask yet.
    </div>
    <form [formGroup]="addForm" (ngSubmit)="addRequestClarification()">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="requestedTo" class="form-label">Ask ({{ counterpartLabel }})</label>
          <select class="form-select" id="requestedTo" formControlName="requestedTo" [class.is-invalid]="invalid('requestedTo')">
            <option [ngValue]="null" disabled>Select a {{ counterpartLabel }}</option>
            <option *ngFor="let user of userData" [ngValue]="user.id">
              {{ user.fullName }} ({{ user.userName }}){{ user.organizationName ? ' - ' + user.organizationName.organizationName : '' }}
            </option>
          </select>
          <div class="invalid-feedback">Choose who to ask.</div>
        </div>
        <div class="col-md-6">
          <label for="module" class="form-label">Module</label>
          <input class="form-control" id="module" formControlName="module" [class.is-invalid]="invalid('module')">
          <div class="invalid-feedback">Module is required.</div>
        </div>
        <div class="col-12">
          <label for="subject" class="form-label">Subject</label>
          <input class="form-control" id="subject" formControlName="subject" [class.is-invalid]="invalid('subject')">
          <div class="invalid-feedback">Subject is required.</div>
        </div>
        <div class="col-12">
          <label for="clarificationRequested" class="form-label">Clarification Request</label>
          <textarea class="form-control" id="clarificationRequested" rows="4" formControlName="clarificationRequested"
                    [class.is-invalid]="invalid('clarificationRequested')"></textarea>
          <div class="invalid-feedback">Describe what needs clarifying.</div>
        </div>
        <div class="col-md-6">
          <label for="expectedDateForClosure" class="form-label">Expected Date For Closure</label>
          <input type="date" class="form-control" id="expectedDateForClosure" [min]="today" formControlName="expectedDateForClosure">
        </div>
        <div class="col-md-6">
          <label for="emailReference" class="form-label">Email Reference</label>
          <input type="email" class="form-control" id="emailReference" formControlName="emailReference" [class.is-invalid]="invalid('emailReference')">
          <div class="invalid-feedback">A valid email is required.</div>
        </div>
      </div>
      <div class="d-flex justify-content-end mt-4">
        <button type="submit" class="btn btn-primary" [disabled]="saving">{{ saving ? 'Sending...' : 'Send Request' }}</button>
      </div>
    </form>
  </div>
</div>
