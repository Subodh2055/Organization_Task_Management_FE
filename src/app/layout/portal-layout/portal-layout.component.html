<div class="container-fluid portal">
  <div class="row">
    <nav class="col-md-3 col-lg-2 portal-sidebar py-4">
      <div class="px-3 mb-3">
        <div class="portal-title">{{ title() }}</div>
        <div class="small text-muted">{{ auth.user()?.fullName }}</div>
      </div>
      <ul class="nav nav-pills flex-column px-2">
        @for (link of links(); track link.path) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="link.path" routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: link.exact }">{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>
    <main class="col-md-9 col-lg-10 py-4 px-md-4">
      <router-outlet />
    </main>
  </div>
</div>
